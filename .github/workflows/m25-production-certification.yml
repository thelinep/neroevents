name: M25 Production Certification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: m25-production-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-certification:
    name: M25 Production Certification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ==================================================
      # NODE / PNPM
      # ==================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runtime
        run: |
          set -eu

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"

      # ==================================================
      # INSTALL
      # ==================================================

      - name: Install dependencies
        run: |
          set -eu
          pnpm install --frozen-lockfile

      # ==================================================
      # PLAYWRIGHT BROWSERS
      # ==================================================

      - name: Install Playwright browsers
        run: |
          set -eu

          pnpm --filter nevo-builder-frontend exec playwright install \
            --with-deps \
            chromium firefox

          echo "Playwright browsers: PASS"

      # ==================================================
      # WORKSPACE PACKAGE BUILD
      # ==================================================

      - name: Build @nevo/auth
        run: |
          set -eu

          rm -rf packages/auth/dist

          pnpm --filter @nevo/auth build

          test -f packages/auth/dist/index.js
          test -f packages/auth/dist/index.d.ts
          test -f packages/auth/dist/policies/permissions.js

          echo "@nevo/auth build: PASS"

      # ==================================================
      # APPLICATION BUILDS
      # ==================================================

      - name: Build backend
        run: |
          set -eu

          rm -rf apps/api/dist

          pnpm --filter nevo-builder-backend build

          test -f apps/api/dist/index.js

          echo "Backend build: PASS"

      - name: Build frontend
        run: |
          set -eu

          rm -rf apps/web/dist

          pnpm --filter nevo-builder-frontend build

          test -f apps/web/dist/index.html

          echo "Frontend build: PASS"

      # ==================================================
      # PRODUCTION BUILD ARTIFACTS
      # ==================================================

      - name: Verify production artifacts
        run: |
          set -eu

          test -f packages/auth/dist/index.js
          test -f packages/auth/dist/index.d.ts

          test -f apps/api/dist/index.js

          test -f apps/web/dist/index.html

          echo "M25 production artifacts: PASS"

          echo
          echo "--- Auth ---"
          du -sh packages/auth/dist

          echo
          echo "--- Backend ---"
          du -sh apps/api/dist

          echo
          echo "--- Frontend ---"
          du -sh apps/web/dist

      # ==================================================
      # DOCKER BUILD
      # ==================================================

      - name: Build production containers
        run: |
          set -eu

          docker compose build

      # ==================================================
      # START PRODUCTION STACK
      # ==================================================

      - name: Start production stack
        run: |
          set -eu

          docker compose up -d

          docker compose ps

      # ==================================================
      # WAIT FOR SERVICES
      # ==================================================

      - name: Wait for PostgreSQL
        run: |
          set -eu

          for i in $(seq 1 60); do
            if docker compose exec -T postgres \
              pg_isready -U nevo -d nevo_test; then
              echo "PostgreSQL ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL... attempt ${i}/60"
            sleep 2
          done

          echo "PostgreSQL failed to become ready"
          docker compose logs postgres || true
          exit 1

      - name: Wait for Redis
        run: |
          set -eu

          for i in $(seq 1 60); do
            if docker compose exec -T redis redis-cli ping | grep -q '^PONG$'; then
              echo "Redis ready"
              exit 0
            fi

            echo "Waiting for Redis... attempt ${i}/60"
            sleep 2
          done

          echo "Redis failed to become ready"
          docker compose logs redis || true
          exit 1

      - name: Wait for backend readiness
        run: |
          set -eu

          for i in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/ready; then
              echo
              echo "Backend ready"
              exit 0
            fi

            echo "Waiting for backend... attempt ${i}/60"
            sleep 2
          done

          echo
          echo "Backend failed to become ready"
          docker compose logs backend || true
          exit 1

      - name: Wait for frontend
        run: |
          set -eu

          for i in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3001/ > /tmp/frontend.html; then
              echo "Frontend ready"
              exit 0
            fi

            echo "Waiting for frontend... attempt ${i}/60"
            sleep 2
          done

          echo
          echo "Frontend failed to become ready"
          docker compose logs frontend || true
          exit 1

      # ==================================================
      # RUNTIME HEALTH
      # ==================================================

      - name: Verify PostgreSQL
        run: |
          set -eu

          docker compose exec -T postgres \
            pg_isready -U nevo -d nevo_test

          echo "PostgreSQL: PASS"

      - name: Verify Redis
        run: |
          set -eu

          test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = "PONG"

          echo "Redis: PASS"

      - name: Verify API health
        run: |
          set -eu

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/health

          echo
          echo "API health: PASS"

      - name: Verify API readiness
        run: |
          set -eu

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ready

          echo
          echo "API readiness: PASS"

      # ==================================================
      # FRONTEND / NGINX
      # ==================================================

      - name: Verify production SPA
        run: |
          set -eu

          curl --fail --silent --show-error \
            http://127.0.0.1:3001/ \
            > /tmp/frontend.html

          grep -q 'id="root"' /tmp/frontend.html

          echo "Production SPA: PASS"

      - name: Verify production JavaScript asset
        run: |
          set -eu

          ASSET="$(
            grep -oE 'src="[^"]+\.js"' /tmp/frontend.html \
              | head -n 1 \
              | sed 's/^src="//;s/"$//'
          )"

          test -n "$ASSET"

          echo "Testing asset: $ASSET"

          curl --fail --silent --show-error \
            -I "http://127.0.0.1:3001${ASSET}"

          echo "Production JavaScript asset: PASS"

      # ==================================================
      # API AUTHENTICATION BOUNDARY
      # ==================================================

      - name: Verify protected API boundary
        run: |
          set -eu

          STATUS="$(
            curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:3000/api/projects
          )"

          test "$STATUS" = "401"

          echo "Protected API boundary: PASS (401)"

      - name: Verify Nginx API proxy
        run: |
          set -eu

          STATUS="$(
            curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:3001/api/projects
          )"

          test "$STATUS" = "401"

          echo "Nginx → API proxy: PASS (401)"

      # ==================================================
      # WEBSOCKET
      # ==================================================

      - name: Verify backend WebSocket
        run: |
          set -eu

          node --input-type=module <<'NODE'
          const ws = new WebSocket('ws://127.0.0.1:3000/ws');

          const timer = setTimeout(() => {
            console.error('M25 WebSocket backend: TIMEOUT');
            process.exit(1);
          }, 10000);

          ws.addEventListener('open', () => {
            clearTimeout(timer);
            console.log('M25 WebSocket backend: PASS');
            ws.close();
          });

          ws.addEventListener('error', (error) => {
            clearTimeout(timer);
            console.error('M25 WebSocket backend: FAIL', error);
            process.exit(1);
          });
          NODE

      - name: Verify Nginx WebSocket proxy
        run: |
          set -eu

          node --input-type=module <<'NODE'
          const ws = new WebSocket('ws://127.0.0.1:3001/ws');

          const timer = setTimeout(() => {
            console.error('M25 WebSocket Nginx: TIMEOUT');
            process.exit(1);
          }, 10000);

          ws.addEventListener('open', () => {
            clearTimeout(timer);
            console.log('M25 WebSocket Nginx: PASS');
            ws.close();
          });

          ws.addEventListener('error', (error) => {
            clearTimeout(timer);
            console.error('M25 WebSocket Nginx: FAIL', error);
            process.exit(1);
          });
          NODE

      # ==================================================
      # PRODUCTION PLAYWRIGHT
      # ==================================================

      - name: Verify Playwright
        run: |
          set -eu

          pnpm --filter nevo-builder-frontend exec playwright --version

      - name: List production Playwright tests
        run: |
          set -eu

          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001 \
          pnpm --filter nevo-builder-frontend exec playwright test \
            --list \
            --project=chromium \
            --project=firefox

      - name: Run production Playwright
        run: |
          set -eu

          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001 \
          pnpm --filter nevo-builder-frontend exec playwright test \
            --project=chromium \
            --project=firefox

      # ==================================================
      # CERTIFICATION SUMMARY
      # ==================================================

      - name: M25 certification summary
        if: ${{ success() }}
        run: |
          echo "========================================"
          echo "M25 PRODUCTION CERTIFICATION: PASS"
          echo "========================================"
          echo
          echo "PostgreSQL:       PASS"
          echo "Redis:             PASS"
          echo "Backend:           PASS"
          echo "API health:        PASS"
          echo "API readiness:     PASS"
          echo "SPA:               PASS"
          echo "Static assets:     PASS"
          echo "API auth boundary: PASS"
          echo "Nginx API proxy:   PASS"
          echo "Backend WebSocket: PASS"
          echo "Nginx WebSocket:   PASS"
          echo "Production E2E:    PASS"
          echo
          echo "M25 CERTIFIED"

      # ==================================================
      # ARTIFACTS
      # ==================================================

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m25-playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m25-playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Docker logs
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/m25-docker-logs

          docker compose logs --no-color \
            > /tmp/m25-docker-logs/docker-compose.log 2>&1 || true

          docker compose logs --no-color backend \
            > /tmp/m25-docker-logs/backend.log 2>&1 || true

          docker compose logs --no-color frontend \
            > /tmp/m25-docker-logs/frontend.log 2>&1 || true

          docker compose logs --no-color postgres \
            > /tmp/m25-docker-logs/postgres.log 2>&1 || true

          docker compose logs --no-color redis \
            > /tmp/m25-docker-logs/redis.log 2>&1 || true

      - name: Upload Docker logs artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m25-docker-logs
          path: /tmp/m25-docker-logs/
          if-no-files-found: ignore
          retention-days: 30

      # ==================================================
      # CLEANUP
      # ==================================================

      - name: Stop production stack
        if: ${{ always() }}
        run: |
          docker compose down