name: M24 Browser Certification

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: m24-browser-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Official Playwright image.
    # Browser binaries and Linux browser dependencies
    # are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nevo
          POSTGRES_PASSWORD: nevo
          POSTGRES_DB: nevo_test
        options: >-
          --health-cmd "pg_isready -U nevo -d nevo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nevo:nevo@postgres:5432/nevo_test
      PORT: 3000
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379

    steps:

      # ==================================================
      # SOURCE
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ==================================================
      # RUNTIME
      # ==================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runtime
        run: |
          set -eu

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"

      - name: Install dependencies
        run: |
          set -eu

          pnpm install --frozen-lockfile

      # ==================================================
      # BACKEND BUILD
      # ==================================================

      - name: Build backend
        run: |
          set -eu

          pnpm --filter nevo-builder-backend build

      # ==================================================
      # API
      #
      # The API startup is responsible for migrations.
      # /ready therefore gates both migrations and startup.
      # ==================================================

      - name: Start API
        run: |
          set -eu

          pnpm --filter nevo-builder-backend start \
            > /tmp/nevo-api.log 2>&1 &

          echo $! > /tmp/nevo-api.pid

          echo "API process started:"
          cat /tmp/nevo-api.pid

      - name: Wait for API readiness
        run: |
          set -eu

          for i in $(seq 1 60); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/ready
            then
              echo
              echo "API ready"
              exit 0
            fi

            echo "Waiting for API... attempt ${i}/60"
            sleep 2
          done

          echo
          echo "========================================"
          echo "API failed to become ready"
          echo "========================================"

          echo
          echo "--- API process ---"

          ps aux | grep -E \
            '[t]sx src/index.ts|[n]evo-builder-backend' \
            || true

          echo
          echo "--- API log ---"

          cat /tmp/nevo-api.log || true

          exit 1

      - name: Verify API health
        run: |
          set -eu

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:3000/health

          echo
          echo "API health OK"

      - name: Verify API readiness
        run: |
          set -eu

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:3000/ready

          echo
          echo "API readiness OK"

      # ==================================================
      # FRONTEND PRODUCTION BUILD
      # ==================================================

      - name: Build frontend
        run: |
          set -eu

          pnpm --filter nevo-builder-frontend build

      - name: Verify frontend build output
        run: |
          set -eu

          test -f apps/web/dist/index.html

          echo "Frontend production build verified:"
          du -sh apps/web/dist

          find apps/web/dist \
            -maxdepth 2 \
            -type f \
            | sort

      # ==================================================
      # PLAYWRIGHT
      #
      # Browser binaries are already present in the
      # official Playwright container.
      #
      # DO NOT run:
      # playwright install --with-deps
      # ==================================================

      - name: Verify Playwright
        run: |
          set -eu

          pnpm exec playwright --version

      - name: List Playwright tests
        run: |
          set -eu

          pnpm --filter nevo-builder-frontend exec playwright test \
            --list \
            --project="${{ matrix.browser }}"

      - name: Run Playwright — ${{ matrix.browser }}
        run: |
          set -eu

          pnpm --filter nevo-builder-frontend exec playwright test \
            --project="${{ matrix.browser }}"

      # ==================================================
      # CERTIFICATION ARTIFACTS
      # ==================================================

      - name: Upload API log
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-api-log-${{ matrix.browser }}
          path: /tmp/nevo-api.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-playwright-${{ matrix.browser }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-test-results-${{ matrix.browser }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload frontend production build
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-frontend-dist-${{ matrix.browser }}
          path: apps/web/dist/
          if-no-files-found: ignore
          retention-days: 30

      # ==================================================
      # CLEANUP
      # ==================================================

      - name: Stop API
        if: ${{ always() }}
        run: |
          if [ -f /tmp/nevo-api.pid ]; then
            PID="$(cat /tmp/nevo-api.pid)"

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" || true
            fi

            sleep 2

            if kill -0 "$PID" 2>/dev/null; then
              kill -9 "$PID" || true
            fi
          fi