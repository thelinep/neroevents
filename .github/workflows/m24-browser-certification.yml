name: M24 Browser Certification

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: m24-browser-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nevo
          POSTGRES_PASSWORD: nevo
          POSTGRES_DB: nevo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nevo -d nevo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nevo:nevo@127.0.0.1:5432/nevo_test
      PORT: 3000
      HOST: 0.0.0.0
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      # ==================================================
      # SOURCE
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ==================================================
      # RUNTIME
      # ==================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runtime
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "pnpm:"
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      # ==================================================
      # DATABASE CLIENTS
      # ==================================================

      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-client \
            redis-tools

      # ==================================================
      # POSTGRESQL
      # ==================================================

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if pg_isready \
              -h 127.0.0.1 \
              -p 5432 \
              -U nevo \
              -d nevo_test
            then
              echo "PostgreSQL ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "========================================"
          echo "PostgreSQL failed to become ready"
          echo "========================================"

          exit 1

      - name: Verify PostgreSQL connection
        run: |
          set -euo pipefail

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT version();"

      # ==================================================
      # REDIS
      # ==================================================

      - name: Wait for Redis
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if redis-cli \
              -h 127.0.0.1 \
              -p 6379 \
              ping | grep -q '^PONG$'
            then
              echo "Redis ready"
              exit 0
            fi

            echo "Waiting for Redis..."
            sleep 2
          done

          echo "========================================"
          echo "Redis failed to become ready"
          echo "========================================"

          exit 1

      # ==================================================
      # API
      #
      # IMPORTANT:
      #
      # The API owns migration execution.
      #
      # Do NOT run psql against packages/database/migrations
      # here. apps/api/src/index.ts calls runMigrations()
      # before app.listen().
      # ==================================================

      - name: Start API
        run: |
          set -euo pipefail

          pnpm --filter nevo-builder-backend dev \
            > /tmp/nevo-api.log 2>&1 &

          echo $! > /tmp/nevo-api.pid

          echo "API process started:"
          cat /tmp/nevo-api.pid

      - name: Wait for API readiness
        run: |
          set -euo pipefail

          for i in {1..60}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/ready
            then
              echo
              echo "API ready"
              exit 0
            fi

            echo "Waiting for API... attempt ${i}/60"
            sleep 2
          done

          echo
          echo "========================================"
          echo "API failed to become ready"
          echo "========================================"

          echo
          echo "--- API process ---"
          ps aux | grep -E \
            '[t]sx src/index.ts|[n]evo-builder-backend' \
            || true

          echo
          echo "--- API log ---"
          cat /tmp/nevo-api.log || true

          exit 1

      - name: Verify API health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/health

          echo
          echo "API health OK"

      - name: Verify API readiness
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ready

          echo
          echo "API readiness OK"

      # ==================================================
      # FRONTEND PRODUCTION BUILD
      # ==================================================

      - name: Build frontend
        run: |
          set -euo pipefail

          pnpm --filter nevo-builder-frontend build

      - name: Verify frontend build output
        run: |
          set -euo pipefail

          test -f apps/web/dist/index.html

          echo "Frontend production build verified:"
          du -sh apps/web/dist
          find apps/web/dist -maxdepth 2 -type f | sort

      # ==================================================
      # PLAYWRIGHT
      # ==================================================

      - name: Install Playwright browser
        run: |
          set -euo pipefail

          pnpm exec playwright install --with-deps \
            "${{ matrix.browser }}"

      - name: Verify Playwright browser
        run: |
          pnpm exec playwright --version

      - name: List Playwright tests
        run: |
          set -euo pipefail

          pnpm --filter nevo-builder-frontend exec playwright test \
            --list \
            --project="${{ matrix.browser }}"

      - name: Run Playwright — ${{ matrix.browser }}
        run: |
          set -euo pipefail

          pnpm --filter nevo-builder-frontend exec playwright test \
            --project="${{ matrix.browser }}"

      # ==================================================
      # CERTIFICATION ARTIFACTS
      # ==================================================

      - name: Upload API log
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-api-log-${{ matrix.browser }}
          path: /tmp/nevo-api.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-playwright-${{ matrix.browser }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-test-results-${{ matrix.browser }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload frontend production build
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-frontend-dist-${{ matrix.browser }}
          path: apps/web/dist/
          if-no-files-found: ignore
          retention-days: 30

      # ==================================================
      # CLEANUP
      # ==================================================

      - name: Stop API
        if: ${{ always() }}
        run: |
          if [ -f /tmp/nevo-api.pid ]; then
            PID="$(cat /tmp/nevo-api.pid)"

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" || true
            fi

            sleep 2

            if kill -0 "$PID" 2>/dev/null; then
              kill -9 "$PID" || true
            fi
          fi