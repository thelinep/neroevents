name: M24 Browser Certification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: m24-browser-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nevo
          POSTGRES_PASSWORD: nevo
          POSTGRES_DB: nevo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nevo -d nevo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nevo:nevo@localhost:5432/nevo_test
      PORT: 3000
      HOST: 0.0.0.0
      REDIS_URL: redis://localhost:6379

    steps:
      # --------------------------------------------------
      # Source
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------
      # Runtime
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------
      # Infrastructure
      # --------------------------------------------------

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          set -e

          for i in {1..30}; do
            if pg_isready \
              -h 127.0.0.1 \
              -p 5432 \
              -U nevo \
              -d nevo_test
            then
              echo "PostgreSQL ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready"
          exit 1

      - name: Verify Redis
        run: |
          set -e

          for i in {1..30}; do
            if redis-cli \
              -h 127.0.0.1 \
              -p 6379 \
              ping | grep -q PONG
            then
              echo "Redis ready"
              exit 0
            fi

            echo "Waiting for Redis..."
            sleep 2
          done

          echo "Redis failed to become ready"
          exit 1

      # --------------------------------------------------
      # API
      #
      # IMPORTANT:
      # Migrations are NOT executed here.
      #
      # apps/api/src/index.ts owns startup:
      #
      #   runMigrations()
      #   orchestrator.initialize()
      #   app.listen()
      #
      # This prevents migrations from being applied twice.
      # --------------------------------------------------

      - name: Start API
        run: |
          pnpm --filter nevo-builder-backend dev \
            > /tmp/nevo-api.log 2>&1 &

          echo $! > /tmp/nevo-api.pid

      - name: Wait for API readiness
        run: |
          set -e

          for i in {1..60}; do
            if curl -fsS \
              http://127.0.0.1:3000/ready
            then
              echo
              echo "API ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "========================================"
          echo "API failed to become ready"
          echo "========================================"

          echo
          echo "--- API log ---"
          cat /tmp/nevo-api.log || true

          exit 1

      - name: Verify API health
        run: |
          curl -fsS \
            http://127.0.0.1:3000/health

          echo

      # --------------------------------------------------
      # Frontend
      # --------------------------------------------------

      - name: Build frontend
        run: |
          pnpm --filter nevo-builder-frontend build

      # --------------------------------------------------
      # Playwright
      # --------------------------------------------------

      - name: Install Playwright browser
        run: |
          pnpm exec playwright install --with-deps \
            ${{ matrix.browser }}

      - name: List Playwright tests
        run: |
          pnpm --filter nevo-builder-frontend exec playwright test \
            --list \
            --project=${{ matrix.browser }}

      - name: Run Playwright — ${{ matrix.browser }}
        run: |
          pnpm --filter nevo-builder-frontend exec playwright test \
            --project=${{ matrix.browser }}

      # --------------------------------------------------
      # Certification artifacts
      # --------------------------------------------------

      - name: Upload API log
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-api-log-${{ matrix.browser }}
          path: /tmp/nevo-api.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-playwright-${{ matrix.browser }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: m24-test-results-${{ matrix.browser }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30

      # --------------------------------------------------
      # Cleanup
      # --------------------------------------------------

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/nevo-api.pid ]; then
            kill "$(cat /tmp/nevo-api.pid)" || true
          fi